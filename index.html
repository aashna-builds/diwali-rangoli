<div id="hint" data-touch="tap · drag to play · tap the buttons to change music">move · bend the sand &nbsp;|&nbsp; click · ripple + sound &nbsp;|&nbsp; M · music &nbsp;|&nbsp; N · instrument &nbsp;|&nbsp; T · change tune &nbsp;|&nbsp; space · pause &nbsp;|&nbsp; ← → · petals &nbsp;|&nbsp; S · save png</div>
<script>
const touchDev=matchMedia('(hover:none)').matches;
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true});
const vs=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 R;uniform float T;uniform vec2 A;uniform vec2 B;uniform float K;uniform float M;uniform vec2 TR[8];uniform float E;uniform float PT;uniform vec2 MS;
const float PI=3.14159265;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 pal(float t){ // marigold, saffron, hot pink, magenta, violet, indigo, cyan, emerald, lime-gold
  vec3 c[9];
  c[0]=vec3(1.0,.72,.05);c[1]=vec3(1.0,.35,.0);c[2]=vec3(1.0,.1,.45);c[3]=vec3(.9,.1,.9);
  c[4]=vec3(.55,.2,1.0);c[5]=vec3(.15,.35,1.0);c[6]=vec3(.0,.9,1.0);c[7]=vec3(.1,1.0,.5);c[8]=vec3(.85,1.0,.15);
  t=fract(t)*9.;int i=int(floor(t));float f=smoothstep(0.,1.,fract(t));
  return mix(c[i%9],c[(i+1)%9],f);
}
float lum_est(vec3 c){return dot(c,vec3(.33));}
float chl(vec2 p,float n,float m){
  return cos(n*PI*p.x)*cos(m*PI*p.y)-cos(m*PI*p.x)*cos(n*PI*p.y);
}
float neon(float f,float w){ // glow around nodal line
  float g=fwidth(f)+1e-4;
  float d=abs(f)/g;
  return exp(-d*d/(w*w))*1.0 + 0.35*exp(-d/(w*5.));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y)*2.0;
  if(R.x<R.y)uv*=.8;
  // gentle lens-warp toward the cursor
  vec2 dm=uv-MS;float dl=length(dm);
  uv+=dm*exp(-dl*dl*2.5)*-.08*(.4+E);
  float r=length(uv);float a=atan(uv.y,uv.x);
  // kaleidoscope fold -> petals
  float seg=2.*PI/K;
  float af=abs(mod(a+seg*.5,seg)-seg*.5);
  vec2 q=r*vec2(cos(af),sin(af));
  float breathe=1.+.03*sin(T*.6);
  vec2 s=q*(1.4*breathe)+vec2(T*.01);
  vec3 col=vec3(0.);
  // two interfering chladni layers
  float f1=chl(s,A.x,A.y);
  float f2=chl(s*1.0,B.x,B.y);
  float l1=neon(f1,1.1), l2=neon(f2,0.8);
  col+=pal(r*.55+T*.035)*l1*.9;
  col+=pal(r*.55+.5+T*.035)*l2*.55;
  // filled colour: rangoli powder between the sand lines
  float sd1=smoothstep(-.35,.35,f1), sd2=smoothstep(-.35,.35,f2);
  float fadeR=smoothstep(1.25,.2,r);
  col+=pal(r*.9+sd1*.45+T*.03)*(.07+.20*sd1)*(.4+.6*fadeR);
  col+=pal(r*.9+.55+sd2*.4-T*.03)*(.04+.14*sd2)*fadeR;
  // rangoli ring dots
  for(int i=0;i<5;i++){
    float fi=float(i);
    float rr=.22+fi*.19;
    float cnt=K*(1.+fi);
    float sg=2.*PI/cnt;
    float aa=mod(a+sg*.5+fi*.2,sg)-sg*.5;
    vec2 d=vec2(r-rr,aa*rr);
    float dd=length(d);
    float sz=.012+.004*sin(T*1.5+fi*1.3);
    float dot_=exp(-dd*dd/(sz*sz))+.25*exp(-dd/(sz*3.));
    col+=pal(fi*.17+T*.04+.1)*dot_*1.3;
    // thin ring line
    float ring=exp(-pow((r-rr-.075)*R.y*.006,2.));
    col+=pal(fi*.17+.3+T*.04)*ring*.18;
  }
  // petal outlines (lotus): scalloped ring
  float pet=abs(r-(.9+.06*cos(a*K+T*.4)))*R.y*.007;
  col+=pal(a/(2.*PI)+T*.05)*exp(-pet*pet)*.8;
  float pet2=abs(r-(.55+.05*cos(a*K*2.))) *R.y*.007;
  col+=pal(.6+T*.05)*exp(-pet2*pet2)*.5;
  // diya core
  float core=exp(-r*r*70.);
  col+=vec3(1.,.72,.22)*core*1.8+vec3(1.,.3,.1)*exp(-r*r*8.)*.35;
  // cursor: comet trail of glowing diya-sparks
  for(int i=0;i<8;i++){
    float fi=float(i);
    float d=length(gl_FragCoord.xy/R.y*2.-vec2(R.x/R.y,1.)-TR[i]);
    float sz=.05*(1.-fi/9.);
    col+=pal(.05+fi*.07+T*.1)*exp(-d*d/(sz*sz))*(1.-fi/9.)*(.5+E*1.2);
    col+=pal(.1+fi*.07+T*.1)*exp(-d/(sz*2.2))*.07*(1.-fi/9.);
  }
  vec2 cp=gl_FragCoord.xy/R.y*2.-vec2(R.x/R.y,1.);
  float cd=length(cp-TR[0]);
  // ripple rings sent out on click / movement
  float rp=abs(cd-PT*.9)*R.y*.01;
  col+=pal(cd*2.+T*.2)*exp(-rp*rp)*exp(-PT*2.2)*1.2*step(PT,2.);
  // GLITTER: twinkling 4-point sparkles in several sizes, brighter near the cursor
  for(int L=0;L<3;L++){
    float cs=float(L==0?11:(L==1?19:31));
    vec2 gp=gl_FragCoord.xy/cs*(1.+float(L)*.0)+float(L)*17.3;
    vec2 id=floor(gp);vec2 lc=fract(gp)-.5;
    float rn=h(id+float(L)*3.1);
    if(rn>.55){
      vec2 jit=vec2(h(id+9.2),h(id+4.7))-.5;
      vec2 d=lc-jit*.6;
      float tw=pow(max(0.,sin(T*(1.2+h(id+1.3)*4.)+rn*60.)),8.);
      float star=exp(-dot(d,d)*(90.))+exp(-abs(d.x)*45.-abs(d.y)*5.5)*.9+exp(-abs(d.y)*45.-abs(d.x)*5.5)*.9;
      float near=1.+4.*exp(-cd*cd*3.5)*(.4+E);
      vec3 gc=mix(pal(rn*3.+T*.12),vec3(1.),.45);
      col+=gc*star*tw*near*(L==0?.9:(L==1?.7:.55))*(.6+lum_est(col)*2.);
    }
  }
  // soft outer fade + vignette
  col*=smoothstep(1.7,.9,r*(.9+.1*M));
  // tone: keep neon saturated
  col=1.-exp(-col*1.25);
  col=pow(col,vec3(.9));
  // background deep aubergine
  vec3 bg=mix(vec3(.05,.01,.1),vec3(.02,0.,.04),smoothstep(0.,1.6,r));
  col=bg+col;
  // film grain (luma-weighted, animated)
  float g=h(gl_FragCoord.xy+floor(T*24.)*7.13)-.5;
  float g2=h(gl_FragCoord.xy*.5+floor(T*12.)*3.7)-.5;
  float lum=dot(col,vec3(.33));
  col+=(g*.16+g2*.08)*(.5+lum);
  // sand speckle
  float sp=step(.9975,h(floor(gl_FragCoord.xy/1.5)+floor(T*6.)));
  col+=sp*pal(r)*.35*lum*3.;
  o=vec4(clamp(col,0.,1.),1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const uTR=U('TR'),uE=U('E'),uPT=U('PT'),uMS=U('MS');
const uR=U('R'),uT=U('T'),uA=U('A'),uB=U('B'),uK=U('K'),uM=U('M');
const modes=[[3,5],[2,7],[4,9],[5,8],[3,10],[6,11],[2,5],[7,12]];
let mi=0,cur=[3,5],cur2=[5,2],tgt=modes[0],tgt2=[5,2],K=12,paused=false,t=0,last=performance.now();
function pick(){mi=(mi+1+Math.floor(Math.random()*3))%modes.length;tgt=modes[mi];tgt2=modes[(mi+3)%modes.length].map(v=>v*.8);}
const curEl=document.getElementById('cur'),ring=document.getElementById('ring');let cx=-100,cy=-100,rx=-100,ry=-100;let mx=0,my=0,sx=0,sy=0,E=0,pulse=9,tr=Array.from({length:8},()=>[0,0]);
function setM(e){cx=e.clientX;cy=e.clientY;curEl.style.transform='translate3d('+cx+'px,'+cy+'px,0)';const w=innerWidth,h=innerHeight;mx=(e.clientX-w/2)/(h/2);my=-(e.clientY-h/2)/(h/2)}
let moved=0,lx=null,ly=null;
let dismissT=null,holdGreeting=false,counting=false;const STAY_MS=0;
function dismiss(){if(holdGreeting||dismissT)return;dismissT=setTimeout(()=>document.getElementById('hd').classList.add('gone'),STAY_MS)}
addEventListener('pointermove',e=>{if(lx!==null)moved+=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;if(moved>12)dismiss()});
addEventListener('pointermove',setM);
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){cx=-100;cy=-100;curEl.style.transform='translate3d(-100px,-100px,0)'}});addEventListener('pointerrawupdate',setM,true);
addEventListener('pointerdown',e=>{dismiss();setM(e);pulse=0;pick()});
addEventListener('keydown',e=>{dismiss();
  if(e.code==='Space'){paused=!paused;e.preventDefault()}
  if(e.key==='ArrowRight')K=Math.min(24,K+2);
  if(e.key==='ArrowLeft')K=Math.max(6,K-2);
  if(e.key==='s'||e.key==='S'){const a=document.createElement('a');a.download='diwali-cymatics.png';a.href=cv.toDataURL('image/png');a.click();}
});
setInterval(()=>{if(!paused)pick()},9000);

/* ============ MUSIC v2: aarti-style Diwali — shehnai, harmonium, dholak, temple bells, conch, fuljhari ============ */
let AC=null,master,verb,NB,musicOn=true,beat=0,started=false;
const SA=261.63;                       // Sa = C4
const SCALE=[1,9/8,5/4,3/2,5/3];       // Bhoopali: S R G P D
function nf(i,base=SA){const o=Math.floor(i/5),d=((i%5)+5)%5;return base*SCALE[d]*Math.pow(2,o)}
let MATRA=.32;                         // seconds per beat (set by the tune)
const mkON=bars=>bars.map(b=>{const o={};let s=0;b.forEach(([i,l])=>{o[s]=[i,l];s+=l});return o});
const TRACKS={
 aarti:{label:'Aarti',blurb:'Aarti: dholak keherwa, flute and harmonium',matra:.32,lead:'bansuri',drums:'keherwa',skip:2,bellVel:.022,
  chords:[[0,2,3],[0,2,3],[4,5,7],[0,2,3],[4,5,7],[0,2,3],[0,2,3],[0,2,3]],
  on:mkON([
   [[2,2],[3,1],[2,1],[1,2],[2,2]],[[1,1],[0,1],[-1,2],[0,2],[1,2]],[[2,1],[3,1],[4,2],[5,2],[4,1],[3,1]],[[3,2],[2,1],[1,1],[2,1],[1,1],[0,2]],
   [[4,2],[5,2],[6,2],[5,1],[4,1]],[[7,2],[6,1],[5,1],[4,2],[3,2]],[[4,1],[5,1],[4,1],[3,1],[2,2],[3,1],[2,1]],[[1,2],[2,1],[1,1],[0,4]]])},
 deepam:{label:'Deepam',blurb:'Deepam: slow, glowing, meditative',matra:.55,lead:'handpan',drums:'soft',skip:1,bellVel:.04,
  chords:[[0,2,3],[0,2,3],[4,5,7],[0,2,3],[4,5,7],[0,2,3],[4,5,7],[0,2,3]],
  on:mkON([
   [[0,4],[2,4]],[[3,4],[2,2],[1,2]],[[2,4],[4,2],[3,2]],[[1,2],[0,6]],
   [[2,2],[3,2],[4,4]],[[5,4],[4,2],[3,2]],[[4,2],[3,2],[2,2],[1,2]],[[0,8]]])},
 utsav:{label:'Utsav',blurb:'Utsav: bright, fast, festive',matra:.22,lead:'bansuri',drums:'festive',skip:2,bellVel:.03,
  chords:[[0,2,3],[0,2,3],[4,5,7],[0,2,3],[0,2,3],[4,5,7],[0,2,3],[0,2,3]],
  on:mkON([
   [[2,1],[2,1],[3,1],[4,1],[5,2],[4,1],[3,1]],[[4,1],[3,1],[2,1],[3,1],[2,2],[1,1],[2,1]],[[2,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,2]],[[6,1],[5,1],[4,1],[5,1],[4,1],[3,1],[2,1],[0,1]],
   [[0,1],[2,1],[3,1],[5,1],[4,1],[3,1],[2,2]],[[2,1],[3,1],[4,1],[3,1],[2,1],[1,1],[2,2]],[[3,1],[4,1],[5,1],[6,1],[7,1],[6,1],[5,2]],[[4,1],[3,1],[2,1],[1,1],[0,4]]])}
};
const TRACK_ORDER=['aarti','deepam','utsav'];let T=TRACKS.aarti,TRACK='aarti';
function updTrack(){document.getElementById('trackbtn').textContent='♫ '+T.label}
function setTrack(name,fresh=true){
  T=TRACKS[name];TRACK=name;MATRA=T.matra;LEAD=T.lead;lastIdx=2;
  if(AC&&fresh){mt=AC.currentTime+.35;mIdx=0}
  updTrack();updLead();if(fresh)toast(T.blurb,2600);
}
function nextTrack(){setTrack(TRACK_ORDER[(TRACK_ORDER.indexOf(TRACK)+1)%TRACK_ORDER.length])}

let silentEl=null;
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   // iOS 17+: play even with the silent switch on
  try{if(!silentEl){silentEl=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');silentEl.loop=true;silentEl.volume=.01}
      silentEl.play().catch(()=>{})}catch(e){}                                         // older iOS: an HTML audio element switches the audio session
  if(!AC)return;
  if(AC.state!=='running')AC.resume();
  try{const b=AC.createBuffer(1,1,22050),sr=AC.createBufferSource();sr.buffer=b;sr.connect(AC.destination);sr.start(0)}catch(e){}
}
function startAudio(){
  if(started){unlockAudio();return}
  started=true;AC=new (window.AudioContext||window.webkitAudioContext)();unlockAudio();
  master=AC.createGain();master.gain.value=0;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  master.connect(comp);comp.connect(AC.destination);
  verb=AC.createConvolver();const len=AC.sampleRate*3.4,ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
  verb.buffer=ib;const vg=AC.createGain();vg.gain.value=.5;verb.connect(vg);vg.connect(master);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  master.gain.linearRampToValueAtTime(.85,AC.currentTime+1.2);
  conch(AC.currentTime+.15);          // the puja opens with a shankh
  drone();
  scheduler(AC.currentTime+3.6);      // aarti groove enters as the conch fades
  crackleLoop();
  updBtn();
}
function out(node,pan=0,wet=.5){
  const p=AC.createStereoPanner?AC.createStereoPanner():null;
  const dry=AC.createGain(),w=AC.createGain();dry.gain.value=1-wet*.5;w.gain.value=wet;
  let src=node;if(p){p.pan.value=pan;node.connect(p);src=p}
  src.connect(dry);dry.connect(master);src.connect(w);w.connect(verb);
}
function tone(t,f0,f1,dur,vel,pan=0,wet=.2){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);
  g.gain.setValueAtTime(vel,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);out(g,pan,wet);o.start(t);o.stop(t+dur+.05);
}
function nz(t,dur,type,freq,Q,vel,pan=0,wet=.25){
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;
  const g=AC.createGain();g.gain.setValueAtTime(vel,t);g.gain.exponentialRampToValueAtTime(.0004,t+dur);
  s.connect(f);f.connect(g);out(g,pan,wet);s.start(t,Math.random()*.8,dur+.02);
}
// tanpura: Pa-Sa-Sa-Sa(low) plucked slowly under everything
function string(f,t,vel=.2,dur=2.4,pan=0){pluckKS(f,t,vel*1.5,{bright:.3,half:1.4,buzz:1.2,hold:3,pan,wet:.5})}
function drone(){
  const seq=[1.5,2,2,1];let n=0;
  (function loop(){if(!AC)return;string((SA/2)*seq[n%4]*(n%4==3?.5:1),AC.currentTime+.05,.1,3.8,n%2?-.4:.4);n++;setTimeout(loop,2200)})();
}
// shehnai: nasal reed — two detuned saws, formant peaks, late vibrato, a little slide into each note
function shehnai(f,t,dur,vel){
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.04);
  g.gain.setValueAtTime(vel*.9,t+Math.max(.06,dur-.1));g.gain.linearRampToValueAtTime(0,t+dur+.1);
  const p1=AC.createBiquadFilter();p1.type='peaking';p1.frequency.value=1150;p1.Q.value=3.5;p1.gain.value=10;
  const p2=AC.createBiquadFilter();p2.type='peaking';p2.frequency.value=2600;p2.Q.value=2.5;p2.gain.value=7;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=5.3;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(16,t+Math.min(.5,dur));vib.connect(vg);
  [0,7].forEach(dt=>{const o=AC.createOscillator();o.type='sawtooth';o.detune.value=dt;
    o.frequency.setValueAtTime(f*.955,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);vg.connect(o.detune);
    const og=AC.createGain();og.gain.value=.5;o.connect(og);og.connect(p1);o.start(t);o.stop(t+dur+.2)});
  vib.start(t);vib.stop(t+dur+.2);p1.connect(p2);p2.connect(lp);lp.connect(g);out(g,.1,.4);
}
// harmonium: reedy sustained chord, one bar at a time
function harm(ch,t,dur){
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.15);
  g.gain.setValueAtTime(.07,t+dur-.1);g.gain.linearRampToValueAtTime(0,t+dur+.25);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;lp.Q.value=.5;
  ch.forEach(i=>[-6,6].forEach(dt=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=nf(i,SA/2);o.detune.value=dt;
    const og=AC.createGain();og.gain.value=.33;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.35)}));
  lp.connect(g);out(g,0,.4);
}
// temple bell (ghanta) / glass chime
function bell(f,t,vel=.12,pan=0){
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.003);g.gain.exponentialRampToValueAtTime(.0005,t+2.6);
  [[1,1],[2.76,.5],[5.4,.28],[8.93,.14]].forEach(([k,a])=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f*k;
    const hg=AC.createGain();hg.gain.value=a;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+2.7)});
  out(g,pan,.8);
}

// ---------- PLUCKED STRINGS: Karplus-Strong physical model (sitar + tanpura) ----------
const KS={};
function ks(f,bright,half,buzz,dur){
  const key=f.toFixed(1)+'|'+bright+'|'+half+'|'+buzz+'|'+dur;if(KS[key])return KS[key];
  const sr=AC.sampleRate,N=Math.max(2,Math.floor(sr/f)),len=Math.floor(sr*dur),b=AC.createBuffer(1,len,sr),y=b.getChannelData(0);
  let p=0,mean=0;for(let i=0;i<N+1;i++){p+=((Math.random()*2-1)-p)*bright;y[i]=p;mean+=p}
  mean/=(N+1);for(let i=0;i<N+1;i++)y[i]-=mean;
  const loss=Math.pow(.5,1/(f*half));
  for(let i=N+1;i<len;i++)y[i]=loss*.5*(y[i-N]+y[i-N-1]);
  let mx=0;for(let i=0;i<len;i++)mx=Math.max(mx,Math.abs(y[i]));
  const sc=.9/(mx||1);for(let i=0;i<len;i++)y[i]*=sc;
  if(buzz){const nrm=Math.tanh(buzz);for(let i=0;i<len;i++)y[i]=Math.tanh(y[i]*buzz)/nrm*.9} // jawari: bridge buzz
  return KS[key]={b,tf:f/(sr/(N+.5))};
}
function pluckKS(f,t,vel,o={}){
  const {bright=.7,half=.5,buzz=0,hold=1.2,pan=0,wet=.35,from=null,dur=3.2}=o;
  const e=ks(f,bright,half,buzz,dur),s=AC.createBufferSource();s.buffer=e.b;
  s.playbackRate.setValueAtTime((from?from/f:1)*e.tf,t);if(from)s.playbackRate.setTargetAtTime(e.tf,t+.02,.07); // meend
  const g=AC.createGain();g.gain.setValueAtTime(vel,t);g.gain.setTargetAtTime(0,t+hold,.3);
  s.connect(g);out(g,pan,wet);s.start(t);s.stop(t+hold+2.2);
}
function sitar(f,t,dur,vel,from=null,pan=-.15){pluckKS(f,t,vel,{bright:.85,half:.55,buzz:2.2,hold:dur*1.1+.2,pan,from})}
// sympathetic strings (taraf): quiet shimmer that rings on after the note
function sym(f,t){
  [1,2,3].forEach((k,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    o.frequency.value=nf(i==0?0:(i==1?3:0),SA)*(i==1?1:2)*(1+i*.0004);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.012,t+.15);g.gain.exponentialRampToValueAtTime(.0004,t+3.6);
    o.connect(g);out(g,(i-1)*.5,.9);o.start(t);o.stop(t+3.8)});
}
// chikari: the high rhythm strings strummed in a quick jhala
function chikari(t,n=4,spacing=.07){
  const seq=[nf(10),nf(8),nf(10),nf(10)];
  for(let j=0;j<n;j++)pluckKS(seq[j%4],t+j*spacing,.1,{bright:.9,half:.25,buzz:1.5,hold:.25,pan:(j%2?.3:-.3),wet:.5,dur:1.4});
}
// ---------- LEAD VOICES (press N or tap the button to switch): bansuri flute, handpan, sitar ----------
let LEAD='bansuri';const LEADS=['bansuri','handpan','sitar'];
function lead(f,t,dur,v,from=null,pan=-.1){
  if(LEAD==='sitar')return sitar(f,t,dur,v*.3,from,pan);
  if(LEAD==='handpan')return handpan(f,t,v,pan);
  return bansuri(f,t,dur,v,from,pan);
}
// bansuri: breathy bamboo flute — soft sine body, a touch of 2nd/3rd, breath noise, late vibrato, slide into the note
function bansuri(f,t,dur,v,from,pan){
  const L=Math.max(.4,dur),A=.2*v;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(A,t+.08);g.gain.setValueAtTime(A,t+Math.max(.1,L-.14));g.gain.linearRampToValueAtTime(0,t+L+.14);
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=5.1;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(11,t+Math.min(.6,L));vib.connect(vg);
  [[1,1],[2,.2],[3,.06]].forEach(([k,a])=>{const o=AC.createOscillator();o.type='sine';
    if(from){o.frequency.setValueAtTime(from*k,t);o.frequency.setTargetAtTime(f*k,t+.015,.05)}else o.frequency.value=f*k;
    vg.connect(o.detune);const og=AC.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+L+.3)});
  const ns=AC.createBufferSource();ns.buffer=NB;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=Math.min(6000,f*3.2);bp.Q.value=1.1;
  const bg=AC.createGain();bg.gain.value=.3;ns.connect(bp);bp.connect(bg);bg.connect(g);ns.start(t,Math.random()*.5);ns.stop(t+L+.3);
  vib.start(t);vib.stop(t+L+.3);out(g,pan,.55);
}
// handpan: round glowing tones with a long shimmer
function handpan(f,t,v,pan){
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.34*v,t+.004);g.gain.exponentialRampToValueAtTime(.0006,t+2.4);
  [[1,1],[2,.5],[3,.2],[4.02,.07]].forEach(([k,a])=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f*k;
    const og=AC.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+2.5)});
  out(g,pan,.65);
}
function updLead(){const b=document.getElementById('leadbtn');b.textContent='♪ '+LEAD;}
function nextLead(){LEAD=LEADS[(LEADS.indexOf(LEAD)+1)%LEADS.length];updLead();toast('Lead: '+LEAD,1600)}
// shankh (conch)
function conch(t){
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+1.3);g.gain.setValueAtTime(.11,t+2.3);g.gain.linearRampToValueAtTime(0,t+3.7);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+1.6);lp.Q.value=2;
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=4.2;vg.gain.value=9;vib.connect(vg);
  [1,2.003,.5].forEach((k,i)=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=SA*k;vg.connect(o.detune);
    const og=AC.createGain();og.gain.value=i==2?.5:.8;o.connect(og);og.connect(lp);o.start(t);o.stop(t+3.9)});
  vib.start(t);vib.stop(t+3.9);lp.connect(g);out(g,0,.75);
}
// dholak keherwa: Dha Ge Na Ti Na Ka Dhi Na
function dhol(t,k){
  if(k=='dha'){tone(t,150,60,.55,.5);nz(t,.05,'bandpass',2200,2,.08)}
  else if(k=='ge'){tone(t,120,62,.3,.2)}
  else if(k=='na'){tone(t,400,360,.12,.1,.3);nz(t,.04,'bandpass',3000,3,.06,.3)}
  else if(k=='ti'){nz(t,.04,'bandpass',3400,3,.07,.3)}
  else if(k=='ka'){tone(t,130,66,.25,.14)}
  else if(k=='dhi'){tone(t,145,62,.4,.3);nz(t,.05,'bandpass',2400,2,.07)}
}
function shaker(t,v){nz(t,.05,'highpass',7000,.7,v,.5,.15)}
function clap(t){nz(t,.09,'bandpass',1500,1.2,.16,0,.4);nz(t+.012,.07,'bandpass',2100,1.2,.1,0,.4)}
// fuljhari sparkler sizzle
function fuljhari(t,dur=1.6,vel=.22){
  const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++){const env=Math.pow(1-i/n,1.6);d[i]=Math.random()<.004?(Math.random()*2-1)*env:0}
  const s=AC.createBufferSource();s.buffer=b;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=3500;
  const g=AC.createGain();g.gain.value=vel*4;s.connect(hp);hp.connect(g);out(g,(Math.random()-.5)*.8,.5);s.start(t);
}
// distant patakhe far off in the neighbourhood (quiet, random)
function crackleLoop(){
  setTimeout(()=>{
    if(AC&&musicOn){const n=3+Math.floor(Math.random()*4);let tt=AC.currentTime+.05;const pan=Math.random()*1.6-.8;
      for(let i=0;i<n;i++){nz(tt,.09,'bandpass',900+Math.random()*900,.9,.06+Math.random()*.04,pan,.5);tt+=.04+Math.random()*.12}}
    crackleLoop();
  },22000+Math.random()*22000);
}
let mt=0,mIdx=0;
function scheduler(startT){
  mt=startT;mIdx=0;
  setInterval(()=>{if(!AC)return;while(mt<AC.currentTime+.6){playMatra(mIdx,mt);mt+=MATRA;mIdx++}},100);
}
let lastIdx=2;
function playMatra(m,t){
  const bar=Math.floor(m/8),mi=m%8,b=bar%8,pass=Math.floor(bar/8),D=T.drums;
  if(D==='keherwa'){dhol(t,['dha','ge','na','ti','na','ka','dhi','na'][mi]);shaker(t,.02);shaker(t+MATRA/2,.01);if(b>=4&&(mi==0||mi==4))clap(t)}
  else if(D==='festive'){dhol(t,['dha','ti','ti','dha','ti','ge','dha','ti'][mi]);shaker(t,.03);shaker(t+MATRA/2,.02);if(mi==2||mi==6)clap(t);if(mi==0&&bar>0&&bar%4==0)fuljhari(t,1.2,.12)}
  else if(D==='soft'){if(mi==0)tone(t,110,52,.8,.22);if(mi==4)tone(t,110,52,.8,.1);shaker(t,.008)}
  if(mi==0||mi==4)bell(mi==0?1318.5:1568,t,T.bellVel,mi==0?-.35:.35);   // temple bell, ding-dong
  if(mi==0)harm(T.chords[b],t,MATRA*8);
  if(LEAD==='sitar'){if(mi==0)chikari(t+.02,4,.07);if(mi==4&&b>=4)chikari(t+.02,3,.06)}
  const n=T.on[b][mi];
  if(n&&!(pass==0&&bar<T.skip)){
    const [i,l]=n;
    const glide=(l>=2&&i!==lastIdx&&Math.abs(i-lastIdx)<=2&&Math.random()<.55)?nf(lastIdx):null; // meend
    lead(nf(i),t,l*MATRA*.95,b>=4?1:.85,glide);
    lastIdx=i;
  }
  setTimeout(()=>{beat=Math.max(beat,mi==0?1:(mi%2==0?.5:0))},Math.max(0,(t-AC.currentTime)*1000));
}
// cursor plays temple-bell chimes in the raga (x = note, speed = how often)
let lastChime=0,lastCF=0,lastCT=0;
function cursorChime(x01,y01,power){
  if(!AC||!musicOn)return;const now=AC.currentTime;if(now-lastChime<.13-power*.05)return;lastChime=now;
  const d=Math.min(4,Math.floor(x01*5)),o=y01<.4?1:0,f=nf(d+5*o);
  lead(f,now,.5,.45+power*.5,(lastCF&&lastCF!==f&&now-lastCT<.5)?lastCF:null,x01*2-1); // glide between notes as you sweep
  lastCF=f;lastCT=now;
}
function burst(x01){ // click: a quick sitar run up the raga, bell sparkle, sparkler
  if(!AC||!musicOn)return;const now=AC.currentTime;
  for(let i=0;i<6;i++)lead(nf(i),now+i*.06,.3,.7,null,(x01*2-1)*.7);
  for(let i=0;i<4;i++)bell(nf(i+7),now+.3+i*.06,.05,(x01*2-1)*.7);
  fuljhari(now+.05,1.5,.2);
}
function updBtn(){const b=document.getElementById('snd');b.textContent=(started&&musicOn)?'♪ on':'♪ off';b.style.opacity=(started&&musicOn)?'.9':'.55'}
function toggleMusic(){
  if(!started){startAudio();return}
  musicOn=!musicOn;master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(musicOn?.85:0,AC.currentTime+.6);updBtn();
}
document.getElementById('snd').addEventListener('pointerdown',e=>{e.stopPropagation();toggleMusic()});
addEventListener('pointerdown',e=>{startAudio();burst(e.clientX/innerWidth)});
['touchend','click'].forEach(ev=>addEventListener(ev,()=>{startAudio();unlockAudio()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume()});
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')toggleMusic();else startAudio()});
let pcx=null,pcy=null;
addEventListener('pointermove',e=>{
  const dx=pcx===null?0:e.clientX-pcx,dy=pcy===null?0:e.clientY-pcy;pcx=e.clientX;pcy=e.clientY;
  if(!started)return;const sp=Math.min(1,Math.hypot(dx,dy)/40);
  if(sp>.15)cursorChime(e.clientX/innerWidth,e.clientY/innerHeight,sp);
});
addEventListener('pointerup',()=>{pcx=null;pcy=null});

function toast(msg,ms=2200){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.opacity=0,ms)}
document.getElementById('leadbtn').addEventListener('pointerdown',e=>{e.stopPropagation();nextLead()});
document.getElementById('trackbtn').addEventListener('pointerdown',e=>{e.stopPropagation();nextTrack()});
addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N')nextLead();if(e.key==='t'||e.key==='T')nextTrack()});
setTrack('aarti',false);
if(touchDev){const h=document.getElementById('hint');h.textContent=h.dataset.touch;addEventListener('pointerdown',()=>{h.style.transition='opacity 1s';h.style.opacity=0},{once:true})}
function fit(){cv.width=Math.round(innerWidth*scale);cv.height=Math.round(innerHeight*scale);gl.viewport(0,0,cv.width,cv.height)}
let scale=Math.min(devicePixelRatio||1,touchDev?1.25:1.5);const maxScale=scale;let ema=16,fc=0,lastAdj=0;
addEventListener('resize',fit);fit();
let Ks=K;
function frame(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)t+=dt;
  ema+=(dt*1000-ema)*.08;if(++fc%30==0){
    if(ema>23&&scale>.5){scale=Math.max(.5,scale-.15);lastAdj=n;fit()}
    else if(ema<17.6&&scale<maxScale&&n-lastAdj>8000){scale=Math.min(maxScale,scale+.1);lastAdj=n;fit()}}
  const k2=1-Math.pow(.00002,dt);rx+=(cx-rx)*k2;ry+=(cy-ry)*k2;
  ring.style.transform='translate3d('+rx+'px,'+ry+'px,0) scale('+(1+E*.7)+')';
  const k=1-Math.pow(.5,dt*1.2); // ease toward target
  for(let i=0;i<2;i++){cur[i]+=(tgt[i]-cur[i])*k;cur2[i]+=(tgt2[i]-cur2[i])*k}
  Ks+=(K-Ks)*k;
  // buttery cursor: critically-damped follow, each trail point lags a bit more
  const f=1-Math.pow(.0001,dt);const px=sx,py=sy;
  sx+=(mx-sx)*f*.9;sy+=(my-sy)*f*.9;
  const sp=Math.hypot(sx-px,sy-py)/Math.max(dt,.001);
  E+=(Math.min(sp*.5,1)-E)*(1-Math.pow(.05,dt));
  tr[0]=[sx,sy];
  for(let i=1;i<8;i++){const g=1-Math.pow(.002,dt*(1.0-i*.08));tr[i][0]+=(tr[i-1][0]-tr[i][0])*g;tr[i][1]+=(tr[i-1][1]-tr[i][1])*g}
  pulse+=dt;
  gl.uniform2fv(uTR,new Float32Array(tr.flat()));gl.uniform1f(uE,E);gl.uniform1f(uPT,pulse);{const kf=(innerHeight/Math.min(innerWidth,innerHeight))*(innerWidth<innerHeight?.8:1);gl.uniform2f(uMS,sx*kf,sy*kf)}
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t);
  gl.uniform2f(uA,cur[0]+sx*.9,cur[1]+sy*.9);gl.uniform2f(uB,cur2[0]-sy*.7,cur2[1]+sx*.7);
  gl.uniform1f(uK,Math.round(Ks/2)*2);beat*=Math.pow(.02,dt);gl.uniform1f(uM,Math.min(1,.5+.5*Math.sin(t*.5)+beat*.35));
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
